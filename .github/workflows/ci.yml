name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./data/test.db

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short

      - name: Run eval tests
        run: uv run pytest tests/evals/ -v --tb=short

      - name: Run integration tests
        run: uv run pytest tests/integration/ -v --tb=short
        env:
          DATABASE_URL: sqlite:///./data/test.db
          # 不配置 Langfuse 密钥，验证 no-op 降级
          OPENAI_API_KEY: test-placeholder
          OPENAI_BASE_URL: http://localhost:9959
          OPENAI_MODEL: test-model

  secrets-check:
    name: Secret Leak Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for .env file
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E "^\.env$"; then
            echo "::error::.env file detected in commit!"
            exit 1
          fi

      - name: Detect secrets
        uses: Yiyiyilse/detect-secrets-action@v1
        with:
          extra_args: --exclude-files '.env.example'
